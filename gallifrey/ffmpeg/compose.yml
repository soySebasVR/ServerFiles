services:
  ffmpeg-worker:
    build: .
    container_name: ffmpeg-worker
    ports:
      - "2222:22"
    volumes:
      - /media:/media
      - /config:/config
      - ./ssh/authorized_keys:/home/ubuntu/.ssh/authorized_keys
    environment:
      - PUID=1000
      - PGID=1000
    restart: always
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute, video]
