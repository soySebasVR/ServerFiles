  postgres17:
    image: tensorchord/vchord-postgres:pg17-v0.5.3
    container_name: postgres17
    restart: unless-stopped
    volumes:
      - ${VOL_CONFIG}/postgres17:/var/lib/postgresql/data
    ports:
      - 5432:5432
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - 6379:6379
