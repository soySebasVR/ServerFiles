services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped
    stop_grace_period: 1m
    mem_limit: 5g
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      MODRINTH_PROJECTS: "lithium,ferrite-core,chunky,spark,rightclickharvest,universal-graves,ledger,bluemap"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      INIT_MEMORY: "2G"
      MAX_MEMORY: "4G"
      USE_AIKAR_FLAGS: "true"
      PAUSE_WHEN_EMPTY_SECONDS: "60"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "8"
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "true"
      MOTD: "Mundo Pink"
      VIEW_DISTANCE: "10"
      TZ: "America/Lima"
    volumes:
      - ${VOL_CONFIG}/minecraft/data:/data

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0.12
    container_name: playit
    restart: unless-stopped
    network_mode: host
    environment:
      SECRET_KEY: