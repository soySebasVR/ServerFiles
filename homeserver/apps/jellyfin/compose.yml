services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:nightly
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 100
      TZ:
      # DOCKER_MODS: linuxserver/mods:jellyfin-rffmpeg
      # RFFMPEG_USER: ubuntu
      # RFFMPEG_HOST: "192.168.0.203"
      # FFMPEG_PATH: /usr/local/bin/ffmpeg
      # JELLYFIN_PublishedServerUrl: http://192.168.0.202:8096
      # TMPDIR: /config/transcodes/
    volumes:
      - ${VOL_CONFIG}/jellyfin/config:/config
      - ${VOL_MEDIA}:/data
    ports:
      - 8096:8096 # Http webUI
      # - 8920:8920 # Https webUI
      - 7359:7359/udp # discover Jellyfin
      - 1900:1900/udp # discovery used by DNLA
    group_add:
      - "106"
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.30
  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER_JELLYSTAT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_JELLYSTAT}
      POSTGRES_IP: ${POSTGRES_IP}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB_JELLYSTAT}
      JWT_SECRET: my-secret-jwt-key
      TZ:
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.31

networks:
  servarrnetwork:
    name: servarrnetwork
    external: true
