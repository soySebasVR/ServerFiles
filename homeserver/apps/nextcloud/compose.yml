services:
  nextcloud:
    image: nextcloud:32
    container_name: nextcloud
    restart: unless-stopped
    networks:
      - internet_access
    ports:
      - 8080:80
    volumes:
      - ${VOL_CONFIG}/nextcloud/data:/var/www/html
      - ${VOL_TANK}/nextcloud/data/data:/var/www/html/data
    environment:
      POSTGRES_HOST: ${DATABASES_HOST}
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB: nextcloud
      REDIS_HOST: ${DATABASES_HOST}
      NEXTCLOUD_TRUSTED_DOMAINS: nc.${DOMAIN},192.168.0.216
      NEXTCLOUD_UPDATE: 1
      NEXTCLOUD_INIT_HTACCESS: true
  nextcloud-cron:
    image: nextcloud:32
    container_name: nextcloud-cron
    restart: unless-stopped
    volumes:
      - ${VOL_CONFIG}/nextcloud/data:/var/www/html
      - ${VOL_TANK}/nextcloud/data/data:/var/www/html/data
    entrypoint: /cron.sh
    depends_on:
      - nextcloud

