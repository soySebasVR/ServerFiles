services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    networks:
      - internet_access
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TOKEN}"]

  newt:
    image: fosrl/newt
    container_name: newt
    restart: unless-stopped
    networks:
      - internet_access
    environment:
      - PANGOLIN_ENDPOINT
      - NEWT_ID
      - NEWT_SECRET

networks:
  internet_access:
    name: internet_access
